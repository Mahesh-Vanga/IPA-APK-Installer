name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline fixture tests
        run: bash test-core.sh
      - name: Build local test packages
        run: BUILD_UNIVERSAL=1 BUILD_PKG=1 bash build-dmg.sh
